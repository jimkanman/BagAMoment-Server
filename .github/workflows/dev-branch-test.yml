name: Jimkanman CI/DE Test

# develop 브랜치로 pull request 날릴 시 트리거되는 이벤트
# PR에 적용되는 거 확인한 후 삭제할 예정
on:
  pull_request:
    branches: [ "develop", "dev" ]

permissions:
  contents: read

jobs:
  build:
    name: Build in Github Actions
    runs-on: ubuntu-22.04

    steps:
      # 저장소 Checkout하여 코드 가져오기
      - name: Checkout branch
        uses: actions/checkout@v3

      # Java 버전 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # yml 파일 복사
      - name: Copy secret
        env:
          APPLICATION_FILE: ${{ secrets.APPLICATION_PROFILE }}
          APPLICATION_FILE_NAME: application.yml
          DIR: ./src/main/resources
        run: |
          touch $DIR/$APPLICATION_FILE_NAME
          echo "$APPLICATION_FILE" > $DIR/$APPLICATION_FILE_NAME

      # gradlew 실행 권한 부여
      - name: Run chmod to make gradlew executable
        run: chmod +x ./gradlew
        shell: bash

      # JAR 파일 생성
      - name: Build with Gradle
        run: ./gradlew clean build -x test
        shell: bash

      - name: Upload Build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            build/libs/*.jar

  deploy:
    name: Deliver using SSH
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      # SCP로 JAR 파일을 EC2에 배포
      - name: SCP JAR to EC2
        uses: appleboy/scp-action@master
        with:
          key: ${{ secrets.EC2_KEY }}
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          source: "*.jar"
          target: "/home/ubuntu/app"

      # EC2에서 JAR 실행
      - name: Deploy SSH
        uses: appleboy/ssh-action@master
        with:
          key: ${{ secrets.EC2_KEY }}
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          # 8080 포트에서 실행 중인 서버 종료 후 재실행
          script: |
            sudo fuser -k -n tcp 8080
            sleep 15
            sudo nohup java -jar /home/ubuntu/app/*.jar > ./nohup.out 2>&1 &
